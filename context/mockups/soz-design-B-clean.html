<style>

  *{box-sizing:border-box;margin:0}

  header{max-width:1320px;margin:0 auto 32px}

  .u{font-family:Unbounded,sans-serif}
  .pillbtn{display:flex;align-items:center;justify-content:space-between;height:56px;border-radius:28px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;padding:0 8px 0 24px}

  .pillbtn.c{justify-content:center;padding:0}
  .tabs{left:0;right:0;bottom:0;height:72px;border-top:1px solid var(--line);background:#fff;display:flex;justify-content:space-around;padding-top:12px}

  .tab.on{color:var(--ink);font-weight:600}
  .seg{display:flex;gap:6px}.seg div{flex:1;font-size:12px;color:var(--ink3);font-weight:500}
  .seg div:before{content:"";display:block;height:4px;border-radius:2px;background:#D8DBE6;margin-bottom:8px}
  .seg .on{color:var(--ink)} .seg .on:before{background:var(--iris)}
  .tile{flex:1;border:1px solid var(--line);border-radius:20px;padding:14px 14px 13px}
  .tile b{font-family:Unbounded;font-weight:600;font-size:21px;letter-spacing:-.5px;display:block}
  .tile span{font-size:12.5px;color:var(--ink2)}
  .dots{display:flex;gap:5px;margin-top:10px}.dots i{width:9px;height:9px;border-radius:5px;background:var(--line)}.dots i.f{background:var(--honey)}
  .ans{height:58px;border-radius:18px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:18px}
  .ans.ok{background:var(--iris);border-color:var(--iris);color:#fff}
  .ghost{width:48px;height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.22);display:grid;place-items:center;color:#fff}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  @keyframes draw{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
  @keyframes tick{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  .orbwrap{animation:breathe 3.4s ease-in-out infinite}
  .orb{width:168px;height:168px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#A79FFF 0,#5B4CFF 42%,#2A1FB8 100%);box-shadow:0 0 90px rgba(91,76,255,.65)}
  .ear{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#8F86FF,#3A2DD6)}
  .eyes{transform-origin:50% 50%;animation:blink 4.4s infinite}
  .line s{display:block;width:2.5px;border-radius:2px;background:var(--iris-lite);transform-origin:center;animation:eq 1.1s ease-in-out infinite}
  .stat3{display:flex}.stat3 div{flex:1;text-align:center}.stat3 div+div{border-left:1px solid var(--line)}
  .stat3 b{font-family:Unbounded;font-weight:600;font-size:25px;letter-spacing:-.6px;display:block}.stat3 span{font-size:12.5px;color:var(--ink2)}
  .day{display:flex;align-items:center;gap:14px;height:58px;padding:0 14px 0 8px;position:relative}
  .day .n{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none;background:#fff;border:1.5px solid var(--line);color:var(--ink3);position:relative;z-index:1}
  .day .n.ok{background:var(--iris);border-color:var(--iris);color:#fff}
  .day .n.cur{border-color:var(--iris);color:var(--iris)}
  .day b{font-weight:600;font-size:15.5px;display:block}.day span{font-size:12.5px;color:var(--ink2)}
  .day.lock b,.day.lock span{color:var(--ink3)}
  .day em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--ink3)}
  .day.cur{background:var(--mist);border-radius:20px;height:68px}
  .mini{margin-left:auto;height:36px;border-radius:18px;background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;padding:0 16px;display:grid;place-items:center}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

  <h1>Вариант B: современный и лаконичный</h1>
  <p>Söz значит «слово», поэтому главный герой экрана здесь само слово: крупная типографика, белый фон, один цвет-акцент и чёрная кнопка. Бобо превращается в простой знак, а в разговоре становится светящимся шаром, который дышит и слушает.</p>
</header>
