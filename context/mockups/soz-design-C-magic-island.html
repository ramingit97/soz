<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Söz — вариант C, волшебный остров</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2A1E5C; --ink2:#6A5F9A; --ink3:#A59CCB; --lav:#EDE7FF; --lav2:#DCD2FA; --lav3:#CDBDF5;
    --vio:#6C4DF2; --vio-d:#4B30C9; --g1:#8BEA5C; --g2:#36C759; --g-d:#1F9A43;
    --sun:#FFC83A; --sun-d:#E59A00; --pink:#FF6FA5; --aqua:#38D6E8; --aqua-d:#1A9FB8;
  }
  *{box-sizing:border-box;margin:0}
  body{background:#E9E6F5;color:var(--ink);font-family:Nunito,system-ui,sans-serif;padding:40px 24px 64px}
  header{max-width:1320px;margin:0 auto 32px}
  header a{font-size:14px;color:var(--ink2);text-decoration:none;font-weight:800}
  header h1{font-family:"M PLUS Rounded 1c";font-weight:900;font-size:33px;letter-spacing:-.5px;line-height:1.15;margin-top:8px}
  header p{margin-top:8px;color:var(--ink2);font-weight:700;font-size:17px;max-width:64ch;line-height:1.45}
  .row{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
  figure{width:308px}
  figcaption{margin-top:14px;font-size:14.5px;line-height:1.45;color:var(--ink2);font-weight:700}
  figcaption b{display:block;color:var(--ink);font-weight:900;font-size:16.5px;margin-bottom:3px}
  .phone{width:308px;height:650px;border-radius:44px;border:9px solid #140E33;background:#fff;position:relative;overflow:hidden;box-shadow:0 26px 54px -18px rgba(42,30,92,.55)}
  .abs{position:absolute} svg{display:block}
  .r{font-family:"M PLUS Rounded 1c",Nunito,sans-serif}

  .glass{display:inline-flex;align-items:center;gap:5px;height:36px;padding:0 11px 0 7px;border-radius:18px;white-space:nowrap;background:rgba(255,255,255,.24);border:1.5px solid rgba(255,255,255,.55);color:#fff;font-weight:900;font-size:14px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);text-shadow:0 1px 0 rgba(42,30,92,.35)}
  .flag{width:24px;height:24px;border-radius:12px;background:#fff;color:var(--vio);font-size:10.5px;font-weight:900;display:grid;place-items:center;text-shadow:none}
  .xbtn{width:38px;height:38px;border-radius:19px;display:grid;place-items:center}
  .candy{display:flex;align-items:center;justify-content:center;gap:10px;height:62px;border-radius:24px;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:21px;color:#fff;background:linear-gradient(var(--g1),var(--g2));box-shadow:0 7px 0 var(--g-d),0 14px 22px -8px rgba(31,154,67,.6);position:relative;text-shadow:0 2px 0 rgba(21,110,48,.45)}
  .candy:before{content:"";position:absolute;left:14px;right:14px;top:6px;height:18px;border-radius:14px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0))}
  .candy.white{background:#fff;color:#1F9A43;text-shadow:none;box-shadow:0 7px 0 #BFEBC8}
  .candy.white:before{display:none}
  .bubble{background:#fff;border-radius:24px;padding:12px 16px;font-weight:800;font-size:15.5px;line-height:1.3;box-shadow:0 5px 0 rgba(42,30,92,.18)}
  .tail:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-10px;width:20px;height:20px;background:#fff;transform:rotate(45deg);border-radius:4px;box-shadow:4px 4px 0 rgba(42,30,92,.12)}

  .sheet{left:0;right:0;bottom:0;background:#fff;border-radius:34px 34px 0 0;padding:18px 20px 82px;box-shadow:0 -8px 30px rgba(42,30,92,.25)}
  .daychip{display:inline-block;background:var(--lav);color:var(--vio);font-weight:900;font-size:12.5px;border-radius:11px;padding:3px 10px}
  .steps{display:flex;justify-content:space-between;position:relative;margin:10px 2px 12px}
  .steps:before{content:"";position:absolute;left:30px;right:22px;top:22px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--lav2) 0 10px,transparent 10px 18px)}
  .step{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--ink3);width:68px}
  .gem{width:50px;height:50px;border-radius:25px;display:grid;place-items:center;background:radial-gradient(circle at 34% 28%,#fff,#E6DEFF 60%,#CFC2F7);box-shadow:0 5px 0 #BDAEEE;color:#9D8FD6}
  .step.now{color:var(--ink)}
  .step.now .gem{background:radial-gradient(circle at 34% 28%,#FFF1A8,#FFC83A 55%,#F2A100);box-shadow:0 5px 0 var(--sun-d);color:#7A4A00;animation:ring 1.8s ease-out infinite}
  .tabbar{left:12px;right:12px;bottom:10px;height:60px;border-radius:26px;background:var(--lav);display:flex;justify-content:space-around;align-items:center}
  .tb{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:800;color:var(--ink3);width:64px}
  .tb.on{color:var(--vio)}
  .tb.on i{width:44px;height:30px;border-radius:15px;background:linear-gradient(#8E73FF,#6C4DF2);display:grid;place-items:center;color:#fff;box-shadow:0 3px 0 var(--vio-d)}
  .tb i{display:grid;place-items:center;height:30px}

  .tube{flex:1;height:20px;border-radius:10px;background:var(--lav2);box-shadow:inset 0 3px 0 rgba(42,30,92,.12);position:relative}
  .tube span{position:absolute;left:0;top:0;bottom:0;width:48%;border-radius:10px;background:linear-gradient(var(--g1),var(--g2));overflow:hidden}
  .tube span:before{content:"";position:absolute;left:6px;right:6px;top:3px;height:5px;border-radius:3px;background:rgba(255,255,255,.55)}
  .tube span:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%);background-size:120px 100%;background-repeat:no-repeat;animation:shine 2.6s infinite}
  .sticker{border-radius:32px;border:7px solid #fff;background:linear-gradient(#CBE6FF,#E8D9FF);height:158px;display:grid;place-items:center;transform:rotate(-3deg);box-shadow:0 9px 0 var(--lav3),0 22px 30px -12px rgba(108,77,242,.45)}
  .ans{height:56px;border-radius:22px;background:#fff;border:3px solid var(--lav2);box-shadow:0 6px 0 var(--lav3);display:grid;place-items:center;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:21px;position:relative}
  .ans.ok{background:linear-gradient(var(--g1),var(--g2));border-color:#2DB850;box-shadow:0 6px 0 var(--g-d);color:#fff;text-shadow:0 2px 0 rgba(21,110,48,.4)}
  .say{width:46px;height:46px;border-radius:17px;background:linear-gradient(#6DE7F3,#23B9D2);box-shadow:0 5px 0 var(--aqua-d);display:grid;place-items:center;color:#fff;flex:none}
  .good{left:0;right:0;bottom:0;background:linear-gradient(#7FE35F,#36C759);border-radius:34px 34px 0 0;padding:24px 20px 20px;color:#fff}

  .night{background:linear-gradient(#1B1452,#3D2A9E 45%,#8459E6 80%,#C48BF0)}
  .mine{background:linear-gradient(90deg,#FF7FB0,#FF9F5A);color:#fff;border-radius:22px 22px 6px 22px;padding:11px 16px;font-weight:900;font-size:16px;box-shadow:0 5px 0 rgba(120,30,80,.35)}
  .ear2{width:112px;height:112px;border-radius:56px;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 6px rgba(56,214,232,.9),0 0 0 7px #fff;animation:ripple 2s ease-out infinite}
  .wave{display:flex;align-items:center;gap:5px;height:48px}
  .wave s{display:block;width:7px;border-radius:4px;background:linear-gradient(#8E73FF,#6C4DF2);transform-origin:center;animation:eq 1s ease-in-out infinite}
  .wave s:nth-child(2){animation-delay:.15s}.wave s:nth-child(3){animation-delay:.3s}.wave s:nth-child(4){animation-delay:.1s}.wave s:nth-child(5){animation-delay:.25s}.wave s:nth-child(6){animation-delay:.4s}
  .gmini{width:50px;height:50px;border-radius:25px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);display:grid;place-items:center;color:#fff}

  .party{background:linear-gradient(#4B30C9,#8C5BE8 45%,#FF8FB0 85%,#FFC58F)}
  .burst{left:50%;top:160px;width:620px;height:620px;margin:-310px 0 0 -310px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.2) 0 10deg,transparent 10deg 20deg);animation:spin 40s linear infinite;-webkit-mask:radial-gradient(closest-side,#000 35%,transparent);mask:radial-gradient(closest-side,#000 35%,transparent)}
  .conf i{position:absolute;top:0;width:9px;height:14px;border-radius:3px;animation:fall 4.5s linear infinite}
  .bigstar{animation:pop .7s cubic-bezier(.3,1.4,.5,1) both;filter:drop-shadow(0 5px 0 rgba(122,60,0,.35))}
  .stat{flex:1;background:#fff;border-radius:20px;padding:10px 4px 9px;text-align:center;box-shadow:0 5px 0 rgba(42,30,92,.2)}
  .stat b{display:block;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:21px;line-height:1.1}
  .stat span{font-weight:800;font-size:11.5px;color:var(--ink2)}
  .gift{border-radius:24px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:linear-gradient(#FFF3C2,#FFD86B);box-shadow:0 5px 0 #E0A92A;font-weight:900;font-size:14.5px;line-height:1.2;color:#6B4300}
  .gift em{font-style:normal;margin-left:auto;background:#fff;color:#B87400;font-weight:900;font-size:13.5px;border-radius:14px;padding:8px 13px;white-space:nowrap;box-shadow:0 3px 0 #E8C15A}

  .badge{width:46px;height:46px;border-radius:23px;display:grid;place-items:center;font-family:"M PLUS Rounded 1c";font-weight:900;font-size:19px;border:3px solid #fff}
  .badge.ok{background:linear-gradient(var(--g1),var(--g2));box-shadow:0 5px 0 var(--g-d);color:#fff}
  .badge.cur{background:radial-gradient(circle at 34% 28%,#FFF1A8,#FFC83A 55%,#F2A100);box-shadow:0 5px 0 var(--sun-d);color:#7A4A00;animation:ring 1.8s ease-out infinite}
  .badge.lock{background:linear-gradient(#E9E2FF,#CFC2F7);box-shadow:0 5px 0 #A99ADF;color:#8F80CC}
  .tip{background:#fff;border-radius:18px;padding:8px 12px 9px;box-shadow:0 5px 0 rgba(42,30,92,.22);font-family:"M PLUS Rounded 1c";font-weight:900;font-size:14.5px;line-height:1.2}
  .tip span{display:block;font-family:Nunito;font-size:12px;font-weight:800;color:var(--ink2)}
  .land{background:rgba(255,255,255,.94);border-radius:14px;padding:5px 10px;font-weight:900;font-size:12.5px;box-shadow:0 3px 0 rgba(42,30,92,.2);white-space:nowrap}

  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes hi{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
  @keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  @keyframes drift{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ring{0%{box-shadow:0 5px 0 var(--sun-d),0 0 0 0 rgba(255,200,58,.8)}100%{box-shadow:0 5px 0 var(--sun-d),0 0 0 15px rgba(255,200,58,0)}}
  @keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
  @keyframes ripple{0%{box-shadow:0 0 0 6px rgba(56,214,232,.9),0 0 0 7px #fff,0 0 0 8px rgba(255,255,255,.5)}100%{box-shadow:0 0 0 6px rgba(56,214,232,.9),0 0 0 7px #fff,0 0 0 40px rgba(255,255,255,0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fall{0%{transform:translateY(-40px) rotate(0)}100%{transform:translateY(700px) rotate(540deg)}}
  @keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
  @keyframes shine{0%{background-position:-120px 0}60%,100%{background-position:260px 0}}
  @keyframes fallwater{to{stroke-dashoffset:-24}}
  .live{animation:bob 3.2s ease-in-out infinite}
  .isl{animation:floaty 5s ease-in-out infinite}
  .isl2{animation:floaty 6s ease-in-out -2s infinite}
  .b-arm{transform-origin:158px 178px;animation:hi 1.6s ease-in-out infinite}
  .b-eyes{transform-origin:110px 92px;animation:blink 4.2s infinite}
  .cloud{animation:drift 10s ease-in-out infinite alternate}
  .tw{animation:twinkle 2.4s ease-in-out infinite}
  .water{stroke-dasharray:6 6;animation:fallwater .8s linear infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
