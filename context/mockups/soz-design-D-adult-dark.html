<style>
  :root{
    --night:#121A3A; --n2:#1C2752; --n3:#2A3870; --n4:#3A4A8C;
    --text:#fff; --t2:#DCE2FA; --t3:#8F9BCB; --t4:#6473A8;
    --mint:#3DE0D0; --mint-soft:rgba(61,224,208,.14);
    --sun:#FFC93C; --sun-d:#DB9B00; --amber:#FFB84D;
  }
  *{box-sizing:border-box;margin:0}
  body{background:#E9ECF5;color:#1B2550;font-family:Onest,system-ui,sans-serif;padding:40px 24px 64px}
  header{max-width:1320px;margin:0 auto 32px}
  header a{font-size:14px;color:#5A648C;text-decoration:none;font-weight:600}
  header h1{font-weight:700;font-size:31px;letter-spacing:-.7px;line-height:1.15;margin-top:8px}
  header p{margin-top:8px;color:#5A648C;font-size:16.5px;max-width:64ch;line-height:1.5}
  .row{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
  figure{width:308px}
  figcaption{margin-top:14px;font-size:14.5px;line-height:1.5;color:#5A648C}
  figcaption b{display:block;color:#1B2550;font-weight:700;font-size:16px;margin-bottom:3px}
  .phone{width:308px;height:650px;border-radius:44px;border:9px solid #0A0F26;background:var(--night);color:var(--text);position:relative;overflow:hidden;box-shadow:0 24px 50px -18px rgba(18,26,58,.6)}
  .abs{position:absolute} svg{display:block}
  .card{background:var(--n2);border-radius:22px;padding:16px}
  .lbl{font-size:13.5px;color:var(--mint);font-weight:600}
  .mut{font-size:13.5px;color:var(--t3);font-weight:500}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;height:54px;border-radius:16px;font-weight:700;font-size:17px;color:var(--night);background:var(--sun);background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 58%);box-shadow:0 4px 0 var(--sun-d)}
  .pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 9px;border-radius:18px;background:var(--n2);font-weight:600;font-size:15px}
  .tabs{left:0;right:0;bottom:0;height:78px;background:var(--n2);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:#7783B5;width:70px}
  .tab i{width:48px;height:32px;border-radius:16px;display:grid;place-items:center}
  .tab.on{color:var(--mint)} .tab.on i{background:var(--mint-soft)}
  .week{display:flex;justify-content:space-between;margin-top:12px}
  .week div{width:32px;text-align:center;font-size:11.5px;color:var(--t3);font-weight:500}
  .week i{display:grid;place-items:center;width:32px;height:32px;border-radius:16px;background:var(--n3);margin-bottom:6px;font-style:normal;color:var(--night)}
  .week .d i{background:var(--sun)}
  .week .t i{background:transparent;border:2px solid var(--mint);color:var(--mint);font-size:18px;line-height:1}
  .li{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;font-weight:500;color:var(--t2);white-space:nowrap}
  .li+.li{border-top:1px solid var(--n3)}
  .li em{margin-left:auto;font-style:normal;color:var(--t3);font-size:13px}
  .ic{width:32px;height:32px;border-radius:11px;background:var(--n3);display:grid;place-items:center;flex:none}
  .bar{height:5px;border-radius:3px;background:var(--n3);overflow:hidden}.bar span{display:block;height:100%;border-radius:3px;background:var(--mint)}
  .opt{height:54px;border-radius:16px;background:var(--n2);border:1.5px solid var(--n3);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:17px;color:var(--t2)}
  .opt.ok{background:var(--mint-soft);border-color:var(--mint);color:var(--mint)}
  .gap{display:inline-block;min-width:44px;text-align:center;color:var(--mint);border-bottom:2px solid var(--mint);padding:0 6px;line-height:1.15}
  .ghost{width:50px;height:50px;border-radius:25px;background:var(--n2);display:grid;place-items:center;color:var(--t2)}
  .stat3{display:flex}.stat3 div{flex:1;text-align:center}.stat3 div+div{border-left:1px solid var(--n3)}
  .stat3 b{font-weight:700;font-size:24px;letter-spacing:-.5px;display:block}.stat3 span{font-size:12.5px;color:var(--t3)}
  .ls{display:flex;align-items:center;gap:12px;height:52px;font-size:14.5px;font-weight:500;color:var(--t2);white-space:nowrap}
  .ls+.ls{border-top:1px solid var(--n3)}
  .ls .n{width:26px;height:26px;border-radius:13px;display:grid;place-items:center;flex:none;font-size:12px;font-weight:600;border:1.5px solid var(--n4);color:var(--t3)}
  .ls .n.ok{background:var(--mint);border-color:var(--mint);color:var(--night)}
  .ls .n.cur{border-color:var(--sun);color:var(--sun)}
  .ls.lock{color:var(--t4)}
  .ls em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--t3)}
  .go{margin-left:auto;height:32px;border-radius:12px;background:var(--sun);color:var(--night);font-weight:700;font-size:13px;padding:0 12px;display:grid;place-items:center}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
  @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
  @keyframes halo{0%{box-shadow:0 0 0 0 rgba(61,224,208,.55),0 0 0 0 rgba(61,224,208,.3)}100%{box-shadow:0 0 0 18px rgba(61,224,208,0),0 0 0 36px rgba(61,224,208,0)}}
  @keyframes draw{from{stroke-dashoffset:290}to{stroke-dashoffset:0}}
  @keyframes tick{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
  .r-eyes{transform-origin:100px 82px;animation:blink 5s infinite}
  .voice{animation:halo 2s ease-out infinite}
  .line s{display:block;width:3px;border-radius:2px;background:var(--mint);transform-origin:center;animation:eq 1.1s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

</defs></svg>

<header>
  <a href="index.html">Все варианты</a>
  <h1>Вариант D: для взрослых и 11+</h1>
  <p>Развитие тёмного экрана, который тебе понравился: глубокий синий фон, спокойные карточки, один жёлтый акцент для главного действия и мятный для прогресса. Никаких сцен и мультяшности: время на каждый шаг, точность, исправления, программа по уровням.</p>
</header>

<div class="row">

<!-- D1 HOME -->
<figure>
<div class="phone">
  <div class="abs" style="left:20px;right:20px;top:20px;display:flex;align-items:center;gap:12px">

  </div>

<figcaption><b>Главный</b>Тот самый экран, без изменений по сути: неделя серии, урок с тремя шагами и временем на каждый, одна жёлтая кнопка.</figcaption>
</figure>

<figure>
<div class="phone">
  <div class="abs" style="left:18px;right:20px;top:24px;display:flex;align-items:center;gap:14px">

<figure>
